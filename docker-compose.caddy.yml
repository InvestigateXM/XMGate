# Standalone setup for a server with nothing on ports 80/443: Caddy gets the
# certificate and proxies to the app. Run with:
#   docker compose -f docker-compose.caddy.yml up -d --build
services:
  app:
    build: .
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
