# Runs the bot behind an existing Nginx Proxy Manager (NPM).
# The app joins NPM's Docker network, so NPM reaches it at http://xmgate:8080.
# PostgreSQL stays on this project's own network and publishes no ports.
# For a server without a reverse proxy, use docker-compose.caddy.yml instead.
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://xmgate:${POSTGRES_PASSWORD}@db:5432/xmgate
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      proxy:
        aliases:
          - xmgate
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xmgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: xmgate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xmgate -d xmgate"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:

networks:
  proxy:
    external: true
    name: ${NPM_NETWORK:-npm_default}
